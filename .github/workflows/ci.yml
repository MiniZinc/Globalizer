name: Build & Package

# Build Globalizer and publish it, so the MiniZinc IDE can bundle a pinned
# version. Unlike FindMUS and mzn-analyse this does not link libminizinc -- it
# is a standalone Haskell program, so it depends on no other MiniZinc release.
#
# Platform coverage is limited by GHC, not by us: there is no GHC for Windows
# ARM64, so that triple cannot be built at all. The aarch64 targets have no stack
# bindist and are provisioned with ghcup instead.

on:
  push:
    # This repository has no `develop`; master is its development branch.
    branches: [master]
    tags: ["*"]
  pull_request: {}
  workflow_dispatch:
    inputs:
      minizinc_release:
        description: "Unused; accepted so the develop chain can dispatch uniformly."
        type: string
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux,       triple: x86_64-linux-gnu,     runner: ubuntu-24.04,     container: "quay.io/pypa/manylinux_2_28_x86_64", setup: "" }
          - { platform: linux-arm64, triple: aarch64-linux-gnu,    runner: ubuntu-24.04-arm, container: "quay.io/pypa/manylinux_2_28_aarch64", setup: "" }
          - { platform: musl,        triple: x86_64-linux-musl,    runner: ubuntu-24.04,     container: "alpine:3.20", setup: "apk add --no-cache bash" }
          - { platform: musl-arm64,  triple: aarch64-linux-musl,   runner: ubuntu-24.04-arm, container: "alpine:3.20", setup: "apk add --no-cache bash" }
          - { platform: osx,         triple: aarch64-apple-darwin, runner: macos-14,         container: "", setup: "" }
          - { platform: osx-intel,   triple: x86_64-apple-darwin,  runner: macos-26-intel,   container: "", setup: "" }
          - { platform: win64,       triple: x86_64-windows,       runner: windows-2022,     container: "", setup: "" }
    runs-on: ${{ matrix.runner }}
    steps:
      # minizinc-hs is a submodule; without it stack has no `minizinc` package.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Keyed on the resolver and the two cabal files: anything else that changes
      # does not change the dependency set.
      - uses: actions/cache@v6
        with:
          path: .stack-root
          key: stack-${{ matrix.platform }}-${{ hashFiles('stack.yaml', '*.cabal', 'submodules/minizinc-hs/*.cabal') }}
          restore-keys: stack-${{ matrix.platform }}-

      # manylinux_2_28 for the same glibc 2.28 floor as the compiler and solvers.
      - name: Build
        shell: bash
        run: |
          set -eux
          SETUP='${{ matrix.setup }}'    # alpine has no bash to run the script with
          mkdir -p .stack-root
          if [ -n "${{ matrix.container }}" ]; then
            # The stack root is mounted at / rather than under /work: stack refuses
            # to create one whose parent directory belongs to another user, and in
            # the container we are root while the workspace is the runner's.
            docker run --rm -v "$PWD:/work" -v "$PWD/.stack-root:/stack-root" -w /work \
              -e ROOT=/work -e STACK_ROOT=/stack-root \
              "${{ matrix.container }}" \
              sh -c "${SETUP}${SETUP:+ && }bash scripts/ci_build.sh"
          else
            ROOT="$PWD" STACK_ROOT="$PWD/.stack-root" bash scripts/ci_build.sh
          fi

      - name: Package
        shell: bash
        run: tar -czf "globalizer-${{ matrix.triple }}.tar.gz" -C globalizer .

      - uses: actions/upload-artifact@v7
        with:
          name: globalizer-${{ matrix.platform }}
          path: globalizer-${{ matrix.triple }}.tar.gz

  publish:
    name: publish release
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish
        shell: bash
        run: |
          set -eux
          mkdir -p upload
          cp artifacts/globalizer-*/globalizer-*.tar.gz upload/
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${{ github.ref_name }}"
            # Only create it if absent; anything else is a real error.
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --title "Globalizer $TAG" --verify-tag \
              --notes "Globalizer $TAG, as bundled with the MiniZinc IDE."
            fi
          else
            TAG=edge
            # Rolling prerelease, updated in place so watchers are not notified
            # on every build.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f -a -m "Development build of Globalizer" "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            NOTES="Continuously updated build of the latest development version."
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --prerelease --title "Globalizer (edge)" --notes "$NOTES"
            else
              gh release create "$TAG" --prerelease --title "Globalizer (edge)" --notes "$NOTES"
            fi
          fi
          gh release upload "$TAG" upload/* --clobber

  # Globalizer does not follow MiniZinc's version numbering, so it cannot be
  # resolved from a release tag; libminizinc's vendor.lock pins it alongside the
  # solvers, and a tagged release offers that bump.
  bump-downstream:
    name: propose the bump to libminizinc
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.MINIZINC_BOT_APP_ID }}
          private-key: ${{ secrets.MINIZINC_BOT_APP_KEY }}
          owner: MiniZinc
          repositories: libminizinc
      - uses: actions/checkout@v7
        with:
          repository: MiniZinc/libminizinc
          # TODO: switch to develop once the migration branch merges.
          # vendor.lock does not exist on develop yet -- it is a migration-era
          # file, introduced only on feat/github_actions.
          ref: feat/github_actions
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Bump the pin
        shell: bash
        run: sed -i -E "s|^globalizer=.*|globalizer=${{ github.ref_name }}|" vendor.lock
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot/bump-globalizer
          # TODO: switch to develop once the migration branch merges.
          base: feat/github_actions
          title: "Bump globalizer to ${{ github.ref_name }}"
          body: |
            Automated bump of the bundled Globalizer release.

            | | |
            |-|-|
            | to   | `${{ github.ref_name }}` |
            | file | `vendor.lock` |

            The bundles build against this before merge.
          labels: dependencies
          commit-message: "Bump globalizer to ${{ github.ref_name }}"
