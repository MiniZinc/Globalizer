variables:
  GIT_SUBMODULE_STRATEGY: recursive

.build_template: &build_definition
  stage: build
  script:
    - mkdir -p globalizer/share/globalizer
    - stack --stack-root ${CI_PROJECT_DIR}/stack --work-dir build --local-bin-path globalizer/bin build --copy-bins --verbose
    - cp -r mznlib/globalizer globalizer/share/globalizer/mznlib
    - cp globalizer.msc globalizer/share/globalizer/
  artifacts:
    paths:
      - globalizer
  cache:
    key: "${MZNARCH}_${CI_COMMIT_REF_SLUG}"
    paths:
      - build/
      - stack/

build:linux:
  <<: *build_definition
  image: haskell:8.2
  variables:
    MZNARCH: "linux"
  tags: [linux, docker, high-mem]

build:osx:
  <<: *build_definition
  variables:
    MZNARCH: "osx"
  tags: [osx, haskell, stack]

build:win64:
  <<: *build_definition
  variables:
    MZNARCH: "win64"
  before_script:
    - 'echo local-programs-path: %CI_PROJECT_DIR%\stack\programs >> stack.yaml'
  script:
    - mkdir globalizer\share\globalizer
    - stack --stack-root %CI_PROJECT_DIR%\stack --work-dir build --local-bin-path globalizer\bin build --copy-bins --verbose
    - cp -r mznlib\globalizer globalizer\share\globalizer\mznlib
    - cp globalizer.msc globalizer\share\globalizer\
  tags: [win64, haskell, stack]
